# Builds, signs and publishes a release when GitLab's push mirror delivers a `v*` tag. Actions are pinned to commit SHAs
# (the comment names the tag); update them by hand. The signing secrets live only in the GitHub Environment `release`,
# whose deployment rule admits `v*` tags only: see RELEASING.md.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The environment holds GPG_PRIVATE_KEY and PASSPHRASE; the job gets them only for a ref its deployment rule allows.
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # goreleaser reads the tag and the history.
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        # A guard against a tag on a stray commit, before the key is imported. It is not a defence against someone who can
        # push a tag whose commit edits this file: keep write access to this repository to the mirror's deploy key.
        run: |
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null || { echo "::error::origin/main is missing: the mirror must push main"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not reachable from main: refusing to sign"; exit 1; }
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          # A tag build that restores a cache could ship what an earlier job left in it.
          cache: false
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          # Same version as the GitLab job (.gitlab-ci.yml, GORELEASER_VERSION).
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
