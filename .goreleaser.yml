# Release build of the provider for registry.terraform.io and registry.opentofu.org, after HashiCorp's
# terraform-provider-scaffolding-framework. GitHub Actions runs `goreleaser release --clean` on a `v*` tag (see
# .github/workflows/release.yml, RELEASING.md); GitLab CI runs `goreleaser check` and an unsigned snapshot build on every
# pipeline so a config mistake shows here first.
version: 2

# Set explicitly: the registries want `terraform-provider-<name>_<version>_<os>_<arch>.zip`, and goreleaser would
# otherwise derive the name from the checkout directory or the git remote.
project_name: terraform-provider-virtscale

builds:
  - env:
      # No CGO: the binary must run where nothing can be installed (HCP Terraform runners, minimal CI images).
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      # main.version is what the provider reports (provider.New(version)); {{ .Version }} has no leading "v".
      - '-s -w -X main.version={{ .Version }}'
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: windows
        goarch: arm
    # The registries expect the binary to be named with the version.
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    # The manifest is covered by the signed checksum file.
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # --batch: the release runs unattended. The key comes from the GPG_FINGERPRINT the release workflow sets.
      - '--batch'
      - '--local-user'
      - '{{ .Env.GPG_FINGERPRINT }}'
      - '--output'
      - '${signature}'
      - '--detach-sign'
      - '${artifact}'

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

changelog:
  disable: true
